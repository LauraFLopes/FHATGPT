<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>FH Wedel Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
    <main class="main-chat">

        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <img src="https://lms.fh-wedel.de/pluginfile.php/1/core_admin/logo/0x200/1743342702/fh-logo.png" alt="FH Wedel Logo">
            </div>
            <div class="header-center">
                <span class="header-title">FH Wedel Chatbot</span>
            </div>
            <div class="header-right">
                <button id="new-chat-btn" class="new-chat-btn" title="Neuer Chat" aria-label="Neuer Chat">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Neuer Chat
                </button>
            </div>
        </header>



        <div class="trennbalken"></div>

        <!-- Chat-Verlauf -->
        <section id="chat-box" class="chat-box">
            {% for message in chat_history %}
            <div class="message {{ message.role }}">{{ message.content.strip() }}</div>
            {% endfor %}
        </section>

        <!-- Eingabefeld -->
        <div class="input-container">
            <input id="question" placeholder="Deine Frage..." autocomplete="off" />
            <button onclick="ask()">➤</button>
        </div>

        <!-- Animation -->
        <div style="position:fixed; bottom:10px; left:0; z-index:9999;">
            <img src="https://i.gifer.com/XOsX.gif" style="width:70px; animation: walk 15s linear infinite;">
        </div>
        <style>
            @keyframes walk {
                0% { transform: translateX(0) scaleX(1); }
                50% { transform: translateX(25vw) scaleX(1); }
                51% { transform: translateX(25vw) scaleX(-1); }
                99% { transform: translateX(0) scaleX(-1); }
                100% { transform: translateX(0) scaleX(1); }
            }
        </style>

    </main>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("question");

    input.addEventListener("keydown", e => {
        if (e.key === "Enter") ask();
    });

     /**
     * Sendet die Benutzerfrage an den Server und verarbeitet die Streaming-Antwort.
     * Erstellt eine temporäre Nachricht mit Lade-Indikator und aktualisiert diese
     * während des Streamings mit den empfangenen Daten.
     */
    function ask() {
        const question = input.value.trim();
        if (!question) return;

        appendMessage("user", question);
        
        // Erstelle temporäre Nachricht für Streaming
        const tempMessage = document.createElement("div");
        tempMessage.className = "message assistant";
        tempMessage.innerHTML = '<span class="typing-indicator">●●●</span>';
        chatBox.appendChild(tempMessage);
        chatBox.scrollTop = chatBox.scrollHeight;
        
        let fullAnswer = "";

        // Verwende Server-Sent Events für Streaming
        fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: question, stream: true })
        })
        .then(response => {
            if (!response.ok) throw new Error('Network response was not ok');
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            
            /**
             * Liest den Stream rekursiv und verarbeitet die empfangenen Daten.
             * Parsed Server-Sent Events und aktualisiert die Anzeige entsprechend.
             */
            function readStream() {
                reader.read().then(({ done, value }) => {
                    if (done) return;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    lines.forEach(line => {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                
                                if (data.type === 'start') {
                                    // Entferne Typing Indicator
                                    tempMessage.innerHTML = '';
                                } else if (data.type === 'chunk') {
                                    // Füge Text hinzu
                                    fullAnswer += data.content;
                                    
                                    // Konvertiere Markdown während des Streamings
                                    const isSingleLine = !fullAnswer.includes('\n');
                                    let markdown = fullAnswer.replace(/\n+$/, '').replace(/\n/g, '  \n');
                                    let html = isSingleLine
                                        ? marked.parseInline(markdown)
                                        : marked.parse(markdown);
                                    
                                    tempMessage.innerHTML = html;
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                } else if (data.type === 'end') {
                                    // Streaming beendet
                                    console.log('Streaming completed');
                                } else if (data.type === 'error') {
                                    tempMessage.innerHTML = `❌ Fehler: ${data.content}`;
                                }
                            } catch (e) {
                                console.error('Error parsing SSE data:', e);
                            }
                        }
                    });
                    
                    readStream(); // Weiterlesen
                });
            }
            
            readStream();
        })
        .catch(error => {
            console.error("Fehler:", error);
            tempMessage.innerHTML = "❌ Es ist ein Fehler aufgetreten. Bitte versuche es erneut.";
        });

        input.value = "";
    }

     /**
     * Fügt eine neue Nachricht zum Chat-Verlauf hinzu.
     * Konvertiert Markdown zu HTML und bereinigt überflüssige Zeilenumbrüche.
     * 
     * @param role Die Rolle des Senders ("user" oder "assistant")
     * @param content Der Nachrichteninhalt
     */
    function appendMessage(role, content) {
        const message = document.createElement("div");
        message.className = `message ${role}`;

        const trimmed = content.trim();
        const isSingleLine = !trimmed.includes('\n');

        let markdown = trimmed.replace(/\n+$/, '').replace(/\n/g, '  \n');
        let html = isSingleLine
            ? marked.parseInline(markdown)
            : marked.parse(markdown);

        html = html.replace(/(<br\s*\/?>\s*)+$/i, '').replace(/(<p>\s*<\/p>\s*)+$/i, '');

        message.innerHTML = html;
        chatBox.appendChild(message);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Neuer Chat Button
    document.getElementById("new-chat-btn").addEventListener("click", () => {
        fetch("/reset", { method: "POST" })
            .then(res => res.json())
            .then(data => {
                // Chat leeren
                chatBox.innerHTML = "";
                // Willkommensnachricht anzeigen
                if (data.message) {
                    appendMessage("assistant", data.message);
                }
            })
            .catch(error => {
                console.error("Fehler beim Reset:", error);
                chatBox.innerHTML = "";
            });
    });
</script>
</body>
</html>
